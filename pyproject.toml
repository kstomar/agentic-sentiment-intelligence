[project]
name = "agentic-sentiment-intelligence"
version = "0.1.0"
description = "API-first customer feedback sentiment analysis and intelligence backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.162.0",
    "groq>=0.37.1,<1",
    "httpx>=0.28.1",
    "langchain-groq>=1,<2",
    "langgraph>=1,<2",
    "langsmith>=0.14.16,<1",
    "mcp==2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
required-version = "==0.13.6"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]
